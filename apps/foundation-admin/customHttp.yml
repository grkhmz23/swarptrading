# AWS Amplify custom headers (https://docs.aws.amazon.com/amplify/latest/userguide/custom-headers.html).
# Amplify reads this file from the app root directory (apps/foundation-admin).
#
# connect-src allows any https origin because the API origin is only known at
# build time; the built index.html also carries a CSP meta tag that pins
# connect-src to VITE_ADMIN_API_URL's origin. Browsers enforce both policies.
customHeaders:
  - pattern: '**'
    headers:
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'Strict-Transport-Security'
        value: 'max-age=63072000; includeSubDomains'
      - key: 'Referrer-Policy'
        value: 'no-referrer'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=(), payment=()'
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
