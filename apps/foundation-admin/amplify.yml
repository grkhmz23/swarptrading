version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Cache the npm download cache, not node_modules (npm ci deletes it).
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Fails if VITE_ADMIN_API_URL is not set in the Amplify environment.
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
