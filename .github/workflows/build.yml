name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/foundation-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/foundation-dashboard/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          NEXT_PUBLIC_SOLANA_NETWORK: devnet

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/foundation-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/foundation-admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          VITE_ADMIN_API_URL: https://api.example.invalid

  preview-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/preview-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/preview-api/package-lock.json
      - run: npm ci
      # Response types are imported from the dashboard's API client, so a change
      # there that the preview data no longer matches fails here.
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: swarp
          POSTGRES_PASSWORD: swarp_ci
          POSTGRES_DB: swarp_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swarp -d swarp_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://swarp:swarp_ci@localhost:5432/swarp_api_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Migrations apply to an empty database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://swarp:swarp_ci@localhost:5432/swarp_api_test
